<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: "Pacifico", cursive;
      font-weight: 400;
      font-size: 3.5rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 300 250" width="300" role="img" aria-label="Illustration of a cream-coloured poodle with a pink bow"
       style="max-width: 100%; height: auto; display: block; margin-bottom: 1rem;">
    <!-- shadow -->
    <ellipse cx="150" cy="232" rx="105" ry="7" fill="#000" opacity="0.08"/>
    <!-- tail -->
    <path d="M88 128 Q72 108 66 88" stroke="#E6CDB5" stroke-width="7" stroke-linecap="round" fill="none"/>
    <g fill="#F4E4D4">
      <circle cx="64" cy="80" r="15"/><circle cx="54" cy="74" r="9"/><circle cx="72" cy="70" r="9"/>
    </g>
    <!-- far legs -->
    <g fill="#E6CDB5">
      <rect x="110" y="150" width="11" height="68" rx="5"/>
      <rect x="186" y="150" width="11" height="68" rx="5"/>
      <circle cx="115" cy="218" r="13"/><circle cx="191" cy="218" r="13"/>
    </g>
    <!-- shaved hindquarters -->
    <ellipse cx="118" cy="140" rx="38" ry="22" fill="#EBD6C2"/>
    <!-- fluffy mane -->
    <g fill="#F4E4D4">
      <circle cx="160" cy="138" r="26"/><circle cx="182" cy="128" r="24"/><circle cx="150" cy="118" r="18"/>
      <circle cx="176" cy="154" r="20"/><circle cx="200" cy="142" r="18"/><circle cx="196" cy="112" r="16"/>
    </g>
    <!-- hip pom -->
    <circle cx="100" cy="140" r="16" fill="#F4E4D4"/>
    <!-- near legs -->
    <g fill="#EBD6C2">
      <rect x="94" y="152" width="12" height="66" rx="6"/>
      <rect x="168" y="160" width="12" height="58" rx="6"/>
    </g>
    <g fill="#F4E4D4">
      <circle cx="100" cy="220" r="14"/><circle cx="174" cy="220" r="14"/>
    </g>
    <!-- neck -->
    <ellipse cx="208" cy="100" rx="15" ry="30" transform="rotate(28 208 100)" fill="#F4E4D4"/>
    <!-- collar -->
    <path d="M196 112 Q210 120 224 106" stroke="#E86A92" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <ellipse cx="226" cy="72" rx="21" ry="17" fill="#EBD6C2"/>
    <ellipse cx="252" cy="80" rx="19" ry="9" fill="#EBD6C2"/>
    <circle cx="270" cy="77" r="5" fill="#3A2A22"/>
    <path d="M250 88 Q258 92 266 87" stroke="#3A2A22" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="236" cy="67" r="3" fill="#3A2A22"/>
    <circle cx="237" cy="66" r="1" fill="#fff"/>
    <!-- topknot -->
    <g fill="#F4E4D4">
      <circle cx="212" cy="54" r="14"/><circle cx="226" cy="46" r="15"/><circle cx="240" cy="54" r="11"/><circle cx="218" cy="40" r="10"/>
    </g>
    <!-- bow -->
    <g fill="#E86A92">
      <path d="M226 36 L214 28 L214 44 Z"/><path d="M226 36 L238 28 L238 44 Z"/><circle cx="226" cy="36" r="4"/>
    </g>
    <!-- ear -->
    <g fill="#E6CDB5">
      <ellipse cx="214" cy="82" rx="11" ry="20"/><circle cx="210" cy="98" r="9"/><circle cx="219" cy="100" r="8"/>
    </g>
  </svg>
  <h1>Hello World</h1>
</body>
</html>
