<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: "Pacifico", cursive;
      font-weight: 400;
      font-size: 3.5rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 300 250" width="300" role="img" aria-label="Illustration of a yellow labrador puppy wearing a blue collar"
       style="max-width: 100%; height: auto; display: block; margin-bottom: 1rem;">
    <!-- shadow -->
    <ellipse cx="150" cy="232" rx="95" ry="7" fill="#000" opacity="0.08"/>
    <!-- tail -->
    <path d="M84 146 Q62 138 54 116" stroke="#E0B46E" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- far legs -->
    <g fill="#D9A85B">
      <rect x="104" y="160" width="18" height="64" rx="9"/>
      <rect x="180" y="160" width="18" height="64" rx="9"/>
    </g>
    <!-- body -->
    <ellipse cx="140" cy="155" rx="66" ry="38" fill="#E8C07D"/>
    <ellipse cx="148" cy="174" rx="44" ry="16" fill="#F2D39B"/>
    <!-- near legs -->
    <g fill="#E8C07D">
      <rect x="84" y="168" width="20" height="58" rx="10"/>
      <rect x="160" y="168" width="20" height="58" rx="10"/>
    </g>
    <g fill="#F2D39B">
      <ellipse cx="96" cy="225" rx="14" ry="7"/><ellipse cx="172" cy="225" rx="14" ry="7"/>
    </g>
    <!-- neck -->
    <ellipse cx="192" cy="134" rx="28" ry="30" fill="#E8C07D"/>
    <!-- collar -->
    <path d="M172 130 Q192 150 220 138" stroke="#3B82C4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="198" cy="152" r="5" fill="#F2C14E"/>
    <!-- head -->
    <circle cx="212" cy="96" r="40" fill="#E8C07D"/>
    <ellipse cx="246" cy="112" rx="26" ry="18" fill="#F2D39B"/>
    <ellipse cx="267" cy="103" rx="9" ry="7" fill="#3A2A22"/>
    <path d="M263 114 Q254 126 240 121" stroke="#3A2A22" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="249" cy="127" rx="5" ry="4.5" fill="#E86A92"/>
    <circle cx="226" cy="84" r="5.5" fill="#3A2A22"/>
    <circle cx="228" cy="82" r="1.8" fill="#fff"/>
    <!-- ear -->
    <path d="M200 62 Q172 64 174 104 Q176 128 192 124 Q208 118 206 82 Z" fill="#D9A85B"/>
  </svg>
  <h1>Hello World</h1>
</body>
</html>
